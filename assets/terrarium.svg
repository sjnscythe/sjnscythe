/>
  </g>
  <!-- CAT -->
  <g fill="#8c959f">
<ellipse
  cx="875"
  cy="246"
  rx="20"
  ry="8"
/>
<circle
  cx="895"
  cy="240"
  r="8"
/>
<!-- ears -->
<path
  d="
    M 889 236
    L 891 226
    L 897 235
    Z
  "
/>
<path
  d="
    M 897 234
    L 903 226
    L 904 237
    Z
  "
