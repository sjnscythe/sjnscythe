  <!-- GRASS -->

<g
stroke=”#8c959f”
stroke-width=“1.5”
stroke-linecap=“round”

<path d="M 45 250 L 40 238"/>
<path d="M 45 250 L 50 240"/>
<path d="M 175 249 L 171 237"/>
<path d="M 175 249 L 181 239"/>
<path d="M 330 250 L 326 239"/>
<path d="M 330 250 L 336 241"/>
<path d="M 680 249 L 676 237"/>
<path d="M 680 249 L 686 239"/>
<path d="M 955 250 L 951 237"/>
<path d="M 955 250 L 961 240"/>
  </g>
</svg>
