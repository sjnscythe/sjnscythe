<svg
xmlns=“http://www.w3.org/2000/svg”
width=“1000”
height=“300”
viewBox=“0 0 1000 300”

  <style>
    .star {
      fill: white;
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .delay1 { animation-delay: 0.5s; }
    .delay2 { animation-delay: 1s; }
    .delay3 { animation-delay: 1.5s; }
    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }
    .cloud {
      animation: moveCloud 25s linear infinite;
    }
    @keyframes moveCloud {
      from { transform: translateX(-200px); }
      to   { transform: translateX(1200px); }
    }
    .walker {
      animation: walkAcross 15s linear infinite alternate;
    }
    @keyframes walkAcross {
      from { transform: translateX(0px); }
      to   { transform: translateX(700px); }
    }
    .train {
      animation: trainAcross 12s linear infinite;
    }
    @keyframes trainAcross {
      from { transform: translateX(-300px); }
      to   { transform: translateX(1400px); }
    }
    .tail {
      animation: tailMove 1.5s ease-in-out infinite alternate;
      transform-origin: 880px 245px;
    }
    @keyframes tailMove {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(10deg); }
    }
  </style>
  <!-- BACKGROUND -->
  <!-- STARS -->
  <circle class="star" cx="70" cy="45" r="2"/>
  <circle class="star delay1" cx="145" cy="90" r="1.5"/>
  <circle class="star delay2" cx="225" cy="38" r="2"/>
  <circle class="star delay3" cx="310" cy="75" r="1.5"/>
  <circle class="star delay1" cx="410" cy="35" r="1.5"/>
  <circle class="star delay2" cx="505" cy="100" r="2"/>
  <circle class="star" cx="590" cy="55" r="1.5"/>
  <circle class="star delay3" cx="690" cy="35" r="2"/>
  <circle class="star delay1" cx="760" cy="105" r="1.5"/>
  <circle class="star delay2" cx="920" cy="50" r="2"/>
  <circle class="star" cx="960" cy="115" r="1.5"/>
  <!-- MOON -->
  <!-- CLOUD -->
  <g class="cloud" fill="#30363d">
<ellipse
  cx="70"
  cy="115"
  rx="55"
  ry="14"
/>
<circle
  cx="45"
  cy="105"
  r="19"
/>
<circle
  cx="85"
  cy="100"
  r="25"
/>
<circle
  cx="115"
  cy="110"
  r="17"
/>
  </g>
  <!-- MOUNTAINS -->
  <!-- SECOND MOUNTAIN LAYER -->
  <!-- TRAIN TRACK -->
  <!-- TRAIN -->
  <g class="train">
<rect
  x="-180"
  y="195"
  width="160"
  height="24"
  rx="3"
  fill="#484f58"
/>
<rect x="-165" y="201" width="18" height="8" fill="#f0f3f6"/>
<rect x="-137" y="201" width="18" height="8" fill="#f0f3f6"/>
<rect x="-109" y="201" width="18" height="8" fill="#f0f3f6"/>
<rect x="-81"  y="201" width="18" height="8" fill="#f0f3f6"/>
<rect x="-53"  y="201" width="18" height="8" fill="#f0f3f6"/>
<circle
  cx="-145"
  cy="219"
  r="5"
  fill="#0d1117"
/>
<circle
  cx="-55"
  cy="219"
  r="5"
  fill="#0d1117"
/>
  </g>
  <!-- GROUND -->
  <!-- WALKING PERSON -->

<g
class=“walker”
stroke=”#f0f3f6”
fill=”#f0f3f6”
stroke-width=“3”
stroke-linecap=“round”

<circle
  cx="100"
  cy="220"
  r="7"
/>
<line
  x1="100"
  y1="227"
  x2="100"
  y2="240"
/>
<line
  x1="100"
  y1="231"
  x2="91"
  y2="237"
/>
<line
  x1="100"
  y1="231"
  x2="109"
  y2="237"
/>
<line
  x1="100"
  y1="240"
  x2="93"
  y2="250"
/>
<line
  x1="100"
  y1="240"
  x2="107"
