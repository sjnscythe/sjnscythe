<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">

<style>
  .rain {
    stroke:#73808c;
    stroke-width:1.4;
    opacity:.32;
    animation:rain .55s linear infinite;
  }

  @keyframes rain {
    from { transform:translateY(-40px); }
    to { transform:translateY(80px); }
  }

  .batman {
    opacity:.10;
    animation:reveal 8s infinite;
  }

  @keyframes reveal {
    0%, 18%, 23%, 25%, 52%, 57%, 100% { opacity:.07; }
    19% { opacity:.42; }
    20% { opacity:.10; }
    21% { opacity:.82; }
    22% { opacity:.14; }

    53% { opacity:.28; }
    54% { opacity:.92; }
    55% { opacity:.16; }
    56% { opacity:.62; }
  }

  .skyFlash {
    fill:#c9d8e8;
    opacity:0;
    animation:flash 8s infinite;
  }

  @keyframes flash {
    0%,18%,20%,22%,52%,54%,56%,100% { opacity:0; }

    19% { opacity:.16; }
    21% { opacity:.35; }

    53% { opacity:.10; }
    55% { opacity:.42; }
  }

  .bolt1 {
    opacity:0;
    animation:bolt1 8s infinite;
  }

  @keyframes bolt1 {
    0%,18%,22%,100% { opacity:0; }
    19% { opacity:.85; }
    20% { opacity:.08; }
    21% { opacity:1; }
  }

  .bolt2 {
    opacity:0;
    animation:bolt2 8s infinite;
  }

  @keyframes bolt2 {
    0%,52%,57%,100% { opacity:0; }
    53% { opacity:.45; }
    54% { opacity:1; }
    55% { opacity:.12; }
    56% { opacity:.8; }
  }

  .eyes {
    opacity:.12;
    animation:eyes 8s infinite;
  }

  @keyframes eyes {
    0%,18%,23%,52%,57%,100% { opacity:.08; }
    19%,21%,54%,56% { opacity:1; }
  }

  .fog {
    animation:fog 22s linear infinite;
  }

  @keyframes fog {
    from { transform:translateX(-180px); }
    to { transform:translateX(1150px); }
  }
</style>


<!-- NIGHT -->

<rect width="1000" height="420" fill="#030507"/>

<rect class="skyFlash"
      width="1000"
      height="420"/>


