L115 185
L195 230
L300 175
L410 230
L520 185
L625 230
L745 175
L855 230
L940 190
L1000 220
L1000 260
L0 260Z"
fill="#21262d"/>

<!-- TRAIN TRACK -->
<line x1="0" y1="220" x2="1000" y2="220"
      stroke="#8b949e" stroke-width="2"/>

<line x1="0" y1="225" x2="1000" y2="225"
      stroke="#30363d" stroke-width="2"/>

<!-- TRAIN -->
<g class="train">

  <rect x="-190" y="193"
        width="170" height="27"
        rx="3"
        fill="#484f58"/>

  <rect x="-175" y="199" width="19" height="9" fill="#f0f6fc"/>
  <rect x="-145" y="199" width="19" height="9" fill="#f0f6fc"/>
  <rect x="-115" y="199" width="19" height="9" fill="#f0f6fc"/>
  <rect x="-85" y="199" width="19" height="9" fill="#f0f6fc"/>
  <rect x="-55" y="199" width="19" height="9" fill="#f0f6fc"/>

  <circle cx="-155" cy="220" r="5" fill="#0d1117"/>
  <circle cx="-55" cy="220" r="5" fill="#0d1117"/>

</g>

<!-- GROUND -->
<path
d="M0 250
Q80 239 160 250
T320 250
T480 250
T640 250
T800 250
T1000 250
L1000 300
L0 300Z"
