<path d="M40 250 L35 238 M40 250 L46 240"/>
<path d="M160 250 L157 237 M160 250 L167 240"/>
<path d="M290 250 L285 240 M290 250 L295 236"/>
<path d="M520 250 L516 238 M520 250 L527 241"/>
<path d="M700 250 L695 237 M700 250 L707 240"/>
<path d="M960 250 L955 238 M960 250 L966 240"/>

</g>

<!-- WALKER -->
<g class="person"
   stroke="#f0f6fc"
   fill="#f0f6fc"
   stroke-width="3"
