<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<style>
.star {
  fill: #ffffff;
  animation: twinkle 2s ease-in-out infinite alternate;
}
.s1 { animation-delay: .4s; }
.s2 { animation-delay: .9s; }
.s3 { animation-delay: 1.4s; }

@keyframes twinkle {
  from { opacity: .15; }
  to { opacity: 1; }
}

.cloud {
  animation: clouds 30s linear infinite;
}
@keyframes clouds {
  from { transform: translateX(-200px); }
  to { transform: translateX(1200px); }
}

.train {
  animation: train 16s linear infinite;
}
@keyframes train {
  from { transform: translateX(-250px); }
  to { transform: translateX(1300px); }
}

.person {
  animation: person 18s ease-in-out infinite alternate;
}
@keyframes person {
  from { transform: translateX(0); }
  to { transform: translateX(650px); }
}

.meteor {
  animation: meteor 8s linear infinite;
}
@keyframes meteor {
  0%, 70% {
    opacity: 0;
    transform: translate(0,0);
  }
  72% {
    opacity: 1;
  }
  82% {
    opacity: 0;
    transform: translate(170px,70px);
  }
  100% {
    opacity: 0;
  }
}
</style>

<!-- SKY -->
<rect width="1000" height="300" fill="#0d1117"/>

<!-- STARS -->
<circle class="star" cx="60" cy="40" r="1.5"/>
<circle class="star s1" cx="125" cy="85" r="1"/>
<circle class="star s2" cx="190" cy="30" r="1.5"/>
<circle class="star s3" cx="260" cy="75" r="1"/>
<circle class="star s1" cx="330" cy="42" r="1"/>
<circle class="star s2" cx="410" cy="95" r="1.5"/>
<circle class="star" cx="475" cy="35" r="1"/>
<circle class="star s3" cx="550" cy="70" r="1.5"/>
<circle class="star s1" cx="625" cy="25" r="1"/>
<circle class="star s2" cx="700" cy="95" r="1"/>
<circle class="star" cx="770" cy="45" r="1.5"/>
<circle class="star s3" cx="900" cy="35" r="1"/>
<circle class="star s1" cx="950" cy="90" r="1.5"/>
<circle class="star s2" cx="850" cy="125" r="1"/>
<circle class="star" cx="365" cy="130" r="1"/>

<!-- MOON -->
<circle cx="835" cy="68" r="28" fill="#f0f6fc"/>
<circle cx="849" cy="57" r="28" fill="#0d1117"/>

<!-- METEOR -->
<g class="meteor">
  <line x1="140" y1="25" x2="90" y2="5"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"/>
</g>

<!-- CLOUD -->
<g class="cloud" fill="#30363d">
  <ellipse cx="90" cy="110" rx="60" ry="14"/>
  <circle cx="55" cy="104" r="19"/>
  <circle cx="90" cy="97" r="26"/>
  <circle cx="125" cy="105" r="18"/>
</g>

<!-- BACK MOUNTAINS -->
<path
d="M0 220
L90 160
L145 200
L230 125
L315 205
L390 155
L470 210
L555 145
L645 205
L730 130
L820 205
L900 150
L1000 215
L1000 260
L0 260Z"
fill="#161b22"/>

<!-- FRONT MOUNTAINS -->
<path
